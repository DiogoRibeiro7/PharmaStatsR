site_name: PharmaStatsR
site_description: Statistical methods and example workflows for pharmaceutical research
site_url: https://diogoribeiro7.github.io/PharmaStatsR/
repo_url: https://github.com/DiogoRibeiro7/PharmaStatsR
repo_name: DiogoRibeiro7/PharmaStatsR
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quickstart.md
      - Project status: project-status.md
      - Dependency and backend audit: dependency-audit.md
      - Illustrative example data: simulated-data.md
  - Statistical methods:
      - Method guide: methods.md
      - Export and evidence inventory: method-inventory.md
      - Core inference reference cases: core-reference-cases.md
      - Equivalence testing: equivalence.md
      - One-way ANOVA: anova.md
      - ANCOVA: ancova.md
      - Stratified CMH test: cmh.md
      - Logistic regression: logistic-regression.md
      - Linear mixed model: linear-mixed-model.md
      - Balanced two-factor ANOVA: factorial-anova.md
      - Paired two-condition ANOVA: repeated-anova.md
      - Two-predictor response surface: response-surface.md
      - Emax dose-response curves: dose-response.md
      - Meta-analysis model choice: meta-analysis.md
      - Network meta-analysis inputs: network-meta-analysis.md
      - Candidate model selection: model-selection.md
      - Python SciPy t-test bridge: scipy-bridge.md
      - Model estimate table exports: report-exports.md
      - Multiple imputation and pooling: missing-data.md
      - Bayesian GLM and predictive checks: bayesian-glm.md
      - Latin square ANOVA: latin-square.md
      - Crossover ANOVA: crossover.md
      - Event-rate comparisons: rates.md
      - Resampling and simulation review: resampling-review.md
      - Wild bootstrap: wild-bootstrap.md
      - Cluster bootstrap: cluster-bootstrap.md
      - Row bootstrap with futures: parallel-bootstrap.md
      - Global permutation F-test: permutation.md
      - Sample size planning: sample-size.md
      - Single-arm posterior threshold: bayesian-threshold.md
      - Group-sequential designs: sequential.md
      - Trial simulation: trial-simulation.md
      - Competing risks: competing-risks.md
      - Kaplan–Meier and log-rank: kaplan-meier.md
      - Cox and parametric survival regression: survival-regression.md
      - Landmark Cox analysis: landmark-analysis.md
      - Time-varying Cox analysis: cox-timevarying.md
      - Correlated outcomes with GEE: gee.md
      - Joint longitudinal and survival models: joint-model.md
      - Multistate transition hazards: multistate.md
      - Audit log integrity: audit-log.md
      - Reporting and monitoring scope: claims-audit.md
      - Model diagnostics: model-diagnostics.md
      - Configuration and registries: configuration-registries.md
      - Limitations and validation: limitations.md
  - Development:
      - Package checks and contribution: development.md
      - API support and lifecycle: api-support-policy.md
      - Documentation reconciliation: documentation-reconciliation.md
      - Method-evidence batches: evidence-batches.md
      - Release candidate evidence: release-candidate.md
