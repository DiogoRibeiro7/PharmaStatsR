name: Diagnostics browser checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostics-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::shiny
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scripts/browser/package-lock.json
      - name: Install browser test tools
        working-directory: scripts/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Check diagnostics workflow and accessibility
        working-directory: scripts/browser
        run: npm test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-browser-evidence
          path: |
            scripts/browser/playwright-report
            scripts/browser/test-results
          if-no-files-found: warn
