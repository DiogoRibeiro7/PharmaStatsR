name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimal-dependencies:
    name: R-CMD-check / required dependencies
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_FORCE_SUGGESTS_: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Audit namespace declarations
        run: Rscript scripts/check_dependency_metadata.R
      # testthat and the vignette tools are check-only dependencies. No
      # Suggested modelling or reporting backends are installed explicitly.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'
      - name: Upload failed check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: required-dependencies-check-results
          path: check
          if-no-files-found: ignore

  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_FORCE_SUGGESTS_: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install SciPy for bridge tests
        run: |
          python -m pip install scipy==1.17.0
          echo "RETICULATE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Audit namespace declarations
        run: Rscript scripts/check_dependency_metadata.R
      # Run the package tests with its hard dependencies and the small
      # testing/vignette toolchain. The optional modelling backends are tested
      # separately when installed, and are not a prerequisite for every PR.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
            any::flexdashboard
            any::shiny
            any::openssl
            any::future
            any::future.apply
            any::cmprsk
            any::geepack
            any::metafor
            any::netmeta
            any::JM
            any::mstate
            any::caret
            any::reticulate
            any::mice
            any::openxlsx
            any::flextable
            any::officer
            any::roxygen2
      - name: Check generated R help
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          git add -N -- NAMESPACE man/
          git diff --check -- NAMESPACE man/
          git diff -- NAMESPACE man/ > documentation-drift.patch
          if test -s documentation-drift.patch; then
            git diff --stat -- NAMESPACE man/
            echo 'Generated R help differs from the committed files.' >&2
            echo 'Run scripts/style_and_doc.sh and commit the changes.' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import sys

          manual = sorted(
              str(path) for path in Path("man").glob("*.Rd")
              if not path.read_text(encoding="utf-8").startswith(
                  "% Generated by roxygen2: do not edit by hand"
              )
          )
          if manual:
              print("R help pages without roxygen source:", *manual, sep="\n", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Upload generated-help diff
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-drift
          path: documentation-drift.patch
          if-no-files-found: ignore
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: r-cmd-check-results
          path: check
