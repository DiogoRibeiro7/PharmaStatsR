name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_FORCE_SUGGESTS_: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install SciPy for bridge tests
        run: |
          python -m pip install scipy==1.17.0
          echo "RETICULATE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Audit namespace declarations
        run: Rscript scripts/check_dependency_metadata.R
      # Run the package tests with its hard dependencies and the small
      # testing/vignette toolchain. The optional modelling backends are tested
      # separately when installed, and are not a prerequisite for every PR.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
            any::flexdashboard
            any::shiny
            any::openssl
            any::future
            any::future.apply
            any::cmprsk
            any::geepack
            any::metafor
            any::caret
            any::reticulate
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: r-cmd-check-results
          path: check
