name: R validation matrix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/R-validation-matrix.yaml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: r-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portability:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }} / required
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
    env:
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_FORCE_SUGGESTS_: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
      - name: Audit namespace declarations
        run: Rscript scripts/check_dependency_metadata.R
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual")'
      - name: Upload failed check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: r-check-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: check
          if-no-files-found: ignore

  optional-backends:
    name: ubuntu-latest / R release / all Suggests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install SciPy for bridge tests
        run: |
          python -m pip install scipy==1.17.0
          echo "RETICULATE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Audit namespace declarations
        run: Rscript scripts/check_dependency_metadata.R
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::rcmdcheck
      - name: Verify all Suggested R packages are installed
        run: Rscript scripts/check_suggests_installed.R
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual")'
      - name: Upload failed check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: r-check-ubuntu-all-suggests
          path: check
          if-no-files-found: ignore
