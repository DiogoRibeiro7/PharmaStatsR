name: R validation matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/R-validation-matrix.yaml'
      - '.Rbuildignore'
      - 'DESCRIPTION'
      - 'LICENSE'
      - 'NAMESPACE'
      - 'NEWS.md'
      - 'R/**'
      - 'data/**'
      - 'inst/**'
      - 'man/**'
      - 'src/**'
      - 'tests/**'
      - 'vignettes/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/R-validation-matrix.yaml'
      - '.Rbuildignore'
      - 'DESCRIPTION'
      - 'LICENSE'
      - 'NAMESPACE'
      - 'NEWS.md'
      - 'R/**'
      - 'data/**'
      - 'inst/**'
      - 'man/**'
      - 'src/**'
      - 'tests/**'
      - 'vignettes/**'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: r-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portability:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }} / required
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
    env:
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_FORCE_SUGGESTS_: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
      - name: Audit namespace declarations
        run: Rscript scripts/check_dependency_metadata.R
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual")'
      - name: Upload failed check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: r-check-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: check
          if-no-files-found: ignore

  optional-backends:
    name: ubuntu-latest / R release / all Suggests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install HTML Tidy for manual validation
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install SciPy for bridge tests
        run: |
          python -m pip install scipy==1.17.0
          echo "RETICULATE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Audit namespace declarations
        run: Rscript scripts/check_dependency_metadata.R
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::rcmdcheck
      - name: Verify all Suggested R packages are installed
        run: Rscript scripts/check_suggests_installed.R
      - name: Build and inspect the candidate source package
        shell: bash
        run: |
          R CMD build .
          tarball=$(find . -maxdepth 1 -type f -name 'PharmaStatsR_*.tar.gz' -print -quit)
          test -n "$tarball"
          tar -tzf "$tarball" > candidate-contents.txt
          sha256sum "$tarball" > candidate-sha256.txt
          git rev-parse HEAD > candidate-commit.txt
          for path in DESCRIPTION NAMESPACE LICENSE R man tests vignettes inst/CITATION; do
            if ! grep -Eq "^PharmaStatsR/${path}(/|$)" candidate-contents.txt; then
              echo "Missing package path: $path" >&2
              exit 1
            fi
          done
          if grep -Eq '^PharmaStatsR/(\.github|docs|data-raw|scripts)/' candidate-contents.txt; then
            echo 'Development-only files found in the source package.' >&2
            exit 1
          fi
          cat candidate-sha256.txt candidate-commit.txt
      - name: Check the built source package as CRAN
        shell: bash
        run: |
          tarball=$(find . -maxdepth 1 -type f -name 'PharmaStatsR_*.tar.gz' -print -quit)
          test -n "$tarball"
          R CMD check --as-cran "$tarball"
      - name: Upload candidate source and check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-source-ubuntu-all-suggests
          path: |
            PharmaStatsR_*.tar.gz
            candidate-contents.txt
            candidate-sha256.txt
            candidate-commit.txt
            PharmaStatsR.Rcheck/00check.log
            PharmaStatsR.Rcheck/00install.out
            PharmaStatsR.Rcheck/*.pdf
          if-no-files-found: ignore
